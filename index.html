<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeInsight AI — AI Software Engineering Inspector</title>
    <!-- Google Fonts for premium typography pairing -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Apply persisted theme before React mounts to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('codedocai-theme');
          var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var effective = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
          if (effective === 'light') {
            document.documentElement.classList.add('light-mode');
            document.documentElement.classList.remove('dark-mode');
          } else {
            document.documentElement.classList.add('dark-mode');
            document.documentElement.classList.remove('light-mode');
          }
          document.documentElement.setAttribute('data-theme-mode', mode);
          document.documentElement.setAttribute('data-theme-effective', effective);
        } catch (e) { /* no-op */ }
      })();
    </script>
  </head>
  <body class="bg-[#0b0c10] text-[#f5f6fa] font-['Plus_Jakarta_Sans',sans-serif] selection:bg-emerald-500/30 selection:text-emerald-400 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
